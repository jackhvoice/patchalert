# Deploy config for Render (https://render.com).
# In the Render dashboard: New -> Blueprint -> point at your repo containing
# this file, and it will read this config automatically.
#
# You will still need to set real environment variables in the Render
# dashboard under this service's Environment tab - do not commit real
# secrets to git:
#   STRIPE_SECRET_KEY, STRIPE_PRICE_ID   (only once you're ready to charge)
#   RESEND_API_KEY, RESEND_FROM_ADDRESS  (only once you're ready to send real email)
#   DIGEST_TRIGGER_SECRET                 (a random string you make up - see below)

services:
  - type: web
    name: patchalert
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 75
    envVars:
      - key: PLANIT_USE_FIXTURE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.15"

# Scheduling the daily digest without a paid tier:
# Render's free plan doesn't include cron jobs, so instead the app exposes
# a POST/GET endpoint at /run-digest?token=YOUR_SECRET that runs the same
# job over HTTP. Set DIGEST_TRIGGER_SECRET to a random string in Render's
# dashboard, then use a free external scheduler to call it once a day:
#   - cron-job.org (free, no account limits that matter here) - add a job
#     that does a GET to https://your-app.onrender.com/run-digest?token=...
#     once a day.
#   - Or a GitHub Actions scheduled workflow in this same repo that runs
#     curl on a cron schedule - see .github/workflows/daily-digest.yml.

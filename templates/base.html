<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PatchAlert{% endblock %}</title>

  <meta name="robots" content="{% block robots_meta %}index, follow{% endblock %}">
  <meta name="description" content="{% block meta_description %}PatchAlert emails UK builders, extension and loft conversion specialists the moment a matching planning application is submitted near them — so you can pitch before anyone else even knows the job exists. Free 7-day trial, no card required.{% endblock %}">
  <link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PatchAlert">
  <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
  <meta property="og:description" content="{{ self.meta_description() }}">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ url_for('static', filename='og-image.png', _external=True) }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.title() }}">
  <meta name="twitter:description" content="{{ self.meta_description() }}">
  <meta name="twitter:image" content="{{ url_for('static', filename='og-image.png', _external=True) }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block structured_data %}{% endblock %}
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21C12 21 19 14.6 19 9.5C19 5.36 15.64 2 11.5 2C7.36 2 4 5.36 4 9.5C4 14.6 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 9.8L11 11.8L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>PatchAlert</span>
    </a>
    <nav style="display: flex; align-items: center; gap: 1.2rem;">
      <a href="{{ url_for('pricing') }}" style="color: var(--navy-dark); font-weight: 600; text-decoration: none;">Pricing</a>
      <a class="nav-cta" href="{{ url_for('signup') }}">Get alerts free</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <p>Planning data via <a href="https://www.planit.org.uk/" target="_blank" rel="noopener">UK PlanIt</a> —
         all of it is public record; we just save you checking every council site yourself.</p>
      <p><a href="{{ url_for('privacy') }}">Privacy</a> · <a href="{{ url_for('terms') }}">Terms</a></p>
    </div>
  </footer>
</body>
</html>
